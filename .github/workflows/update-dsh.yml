# Keep the fork current on two axes:
#
#   1. PACKAGING: merge new commits from Samuka007/dsh-nix (the repo this
#      fork tracks). '-X ours' keeps our pin/version/hash lines when the
#      packaging upstream bumped them too; everything else (packaging
#      fixes, modules, CI) is taken in.
#   2. DSH: overlay the latest deepseek-harness HEAD on top — any
#      upstream change (code, config…) bumps the pin; a new npm version
#      additionally bumps the version and the pnpm lockfile (store hash
#      bootstrap).
#
# Result: fork main = latest dsh-nix packaging + latest dsh.
#
# The pnpm store hash bootstrap (documented in the pkgs/dsh.nix error
# hint): build with the stale hash, parse `got: sha256-…` from the
# fixed-output mismatch, pin it, rebuild.
name: update-dsh

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the packaging merge needs shared ancestry

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@a7ad9c4f0c65208097f4d34f3cfa1913b80cce5c # main
        with:
          determinate: false # plain nixpkgs nix, no Determinate Nix/FlakeHub
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Git identity
        run: |
          git config user.name "hodorov[bot]"
          git config user.email "41879575+github-actions[bot]@users.noreply.github.com"

      - name: Sync packaging from Samuka007/dsh-nix
        id: sync
        run: |
          set -euo pipefail
          # resolve their default branch dynamically (a rename must not
          # break the poll); force-pushed history would make this merge
          # fail loudly for manual intervention
          UPSTREAM_BRANCH=$(curl -sf https://api.github.com/repos/Samuka007/dsh-nix | jq -r .default_branch)
          git remote add upstream "https://github.com/Samuka007/dsh-nix.git"
          git fetch -q upstream "${UPSTREAM_BRANCH}"
          UPSTREAM_HEAD=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          PACKAGING_MERGED=false
          if git merge-base --is-ancestor "${UPSTREAM_HEAD}" HEAD; then
            echo "Packaging already up to date at ${UPSTREAM_HEAD:0:8}"
          else
            git merge -X ours --no-edit "upstream/${UPSTREAM_BRANCH}"
            PACKAGING_MERGED=true
          fi
          echo "packaging_merged=${PACKAGING_MERGED}" >> "$GITHUB_OUTPUT"

      - name: Check dsh upstream
        id: check
        run: |
          set -euo pipefail
          DSH_BRANCH=$(curl -sf https://api.github.com/repos/deepseek-ai/deepseek-harness | jq -r .default_branch)
          REV=$(curl -sf "https://api.github.com/repos/deepseek-ai/deepseek-harness/commits/${DSH_BRANCH}" | jq -r .sha)
          VER=$(curl -sfL "https://raw.githubusercontent.com/deepseek-ai/deepseek-harness/${DSH_BRANCH}/apps/cli/package.json" | jq -r .version)
          CUR_REV=$(sed -n 's|.*deepseek-harness/\([0-9a-f]\{40\}\).*|\1|p' flake.nix | head -1)
          CUR_VER=$(sed -n 's/^[[:space:]]*version = "\([^"]*\)";/\1/p' pkgs/dsh.nix | head -1)
          BUMP=false
          SAME_VERSION=true
          if [ "${REV}" != "${CUR_REV}" ]; then BUMP=true; fi
          if [ "${VER}" != "${CUR_VER}" ]; then SAME_VERSION=false; fi
          NEED_BUILD=false
          if [ "${BUMP}" = "true" ] || [ "${{ steps.sync.outputs.packaging_merged }}" = "true" ]; then
            NEED_BUILD=true
          fi
          {
            echo "rev=${REV}"
            echo "version=${VER}"
            echo "bump=${BUMP}"
            echo "same_version=${SAME_VERSION}"
            echo "need_build=${NEED_BUILD}"
          } >> "$GITHUB_OUTPUT"
          if [ "${BUMP}" = "true" ]; then
            echo "dsh: ${CUR_REV:0:8} -> ${REV:0:8} (version: ${CUR_VER} -> ${VER})"
          else
            echo "dsh already tracking ${REV:0:8} (${VER})"
          fi

      - name: Apply latest-dsh overlay
        if: steps.check.outputs.bump == 'true'
        run: |
          set -euo pipefail
          sed -i "s|deepseek-harness/[0-9a-f]\{40\}|deepseek-harness/${{ steps.check.outputs.rev }}|" flake.nix
          if [ "${{ steps.check.outputs.same_version }}" = "false" ]; then
            sed -i "0,/version = \"[^\"]*\";/s//version = \"${{ steps.check.outputs.version }}\";/" pkgs/dsh.nix
          fi

      - name: Update flake lock
        if: steps.check.outputs.need_build == 'true'
        run: nix flake lock

      - name: Build (pnpm hash bootstrap)
        if: steps.check.outputs.need_build == 'true'
        run: |
          set -uo pipefail
          PKG=".#packages.aarch64-linux.dsh"
          if ! nix build "${PKG}" 2> build.log; then
            if ! grep -q "hash mismatch" build.log; then
              cat build.log
              exit 1
            fi
            NEWHASH=$(sed -n 's/.*got:    \(sha256-[A-Za-z0-9+/=]*\).*/\1/p' build.log | head -1)
            if [ -z "${NEWHASH}" ]; then
              cat build.log
              exit 1
            fi
            sed -i "s|hash = \"[^\"]*\";|hash = \"${NEWHASH}\";|" pkgs/dsh.nix
            if ! nix build "${PKG}" 2> build2.log; then
              cat build2.log
              exit 1
            fi
          fi

      - name: Flake check
        if: steps.check.outputs.need_build == 'true'
        run: nix flake check --system x86_64-linux

      - name: Commit overlay and push
        if: steps.check.outputs.need_build == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.check.outputs.bump }}" = "true" ]; then
            if [ "${{ steps.check.outputs.same_version }}" = "true" ]; then
              MSG="chore: sync dsh upstream to ${{ steps.check.outputs.rev }}"
            else
              MSG="chore: bump dsh to ${{ steps.check.outputs.version }} (${{ steps.check.outputs.rev }})"
            fi
            git add flake.nix flake.lock pkgs/dsh.nix
            git commit -m "${MSG}"
          fi
          # pushes the merge commit (packaging) and/or the overlay commit
          git push
